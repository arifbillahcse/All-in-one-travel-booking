# TravelOrio – Nginx site (Ubuntu 24.04, PHP 8.3-FPM). Replace travelorio.com and the root path.
# NOTE: written for review; not executed in the build sandbox. Run `nginx -t` before reload.
server {
    listen 80;
    listen [::]:80;
    server_name travelorio.com www.travelorio.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://travelorio.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name travelorio.com www.travelorio.com;

    ssl_certificate     /etc/letsencrypt/live/travelorio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/travelorio.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    if ($host = www.travelorio.com) { return 301 https://travelorio.com$request_uri; }

    root /var/www/travelorio/current/public;
    index index.php;
    charset utf-8;

    # photos: up to 10 MB each in the admin panel
    client_max_body_size 12M;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Security headers (CSP, HSTS, nosniff ... are sent by the app itself – do not duplicate them here)
    server_tokens off;

    # Fingerprinted build files and versioned assets: cache hard
    location /build/ { expires 1y; add_header Cache-Control "public, immutable"; access_log off; try_files $uri =404; }
    location /assets/ { expires 30d; add_header Cache-Control "public"; access_log off; try_files $uri =404; }
    location /storage/ { expires 30d; add_header Cache-Control "public"; access_log off; try_files $uri =404; }

    location / { try_files $uri $uri/ /index.php?$query_string; }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;
        fastcgi_read_timeout 60s;
    }

    # never serve dotfiles (.env, .git) – except ACME
    location ~ /\.(?!well-known) { deny all; return 404; }
    location ~* \.(sqlite|sql|zip|log|bak)$ { deny all; return 404; }

    location = /favicon.ico { access_log off; log_not_found off; }
}
