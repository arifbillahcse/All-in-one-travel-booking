; /etc/supervisor/conf.d/travelorio-queue.conf  (then: supervisorctl reread && supervisorctl update)
[program:travelorio-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/travelorio/current/artisan queue:work --sleep=3 --tries=3 --max-time=3600
directory=/var/www/travelorio/current
user=www-data
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/var/log/travelorio-queue.log
